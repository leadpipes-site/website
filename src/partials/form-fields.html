      <div class="f2">
        <label>Your name<input name="name" required autocomplete="name"></label>
        <label>Business name<input name="business" required autocomplete="organization"></label>
      </div>
      <div class="f2">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Mobile<input type="tel" name="phone" required autocomplete="tel"></label>
      </div>
      <div class="f2">
        <label>Website<input type="text" inputmode="url" name="website" placeholder="yourbusiness.com.au" autocomplete="url"></label>
        <label>State
          <select name="state" required>
            <option value="">Choose one</option>
            <option>WA</option><option>NSW</option><option>VIC</option><option>QLD</option><option>SA</option><option>TAS</option><option>NT</option><option>ACT</option><option>National</option>
          </select>
        </label>
      </div>
      {{categoryField}}
      <label>Average sale value (AUD)
        <select name="avg_sale" required>
          <option value="">Choose one</option>
          <option>Under $10,000</option><option>$10,000 to $30,000</option><option>$30,000 to $100,000</option><option>Over $100,000</option>
        </select>
      </label>
      <label>What would growth look like for you?<textarea name="goal" maxlength="600" placeholder="Optional. Where you sell, who you sell to, what a good year looks like."></textarea></label>
      <label class="check"><input type="checkbox" name="consent" required><span>I agree to LeadPipes contacting me by email, phone or SMS about this enquiry. I can opt out at any time. See the <a href="/privacy.html">privacy policy</a>.</span></label>
      <button class="btn" type="submit">{{buttonLabel}}</button>
      <p class="small-print">We reply personally. We do not sell or share your details.</p>
